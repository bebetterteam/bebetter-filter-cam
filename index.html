<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cute Cam</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐱</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="stage">
      <canvas id="out" width="1280" height="720"></canvas>
      <div id="status">กำลังโหลด…</div>
      <div id="fps"></div>
    </div>
    <div id="bar">
      <div id="filters"></div>
      <div class="controls">
        <button id="fx" title="เปิด/ปิด effect (E)">✨ Effects</button>
        <button id="mirror" title="กลับซ้าย-ขวา (M)">↔ Mirror</button>
        <select id="camera" title="เลือกกล้อง"></select>
        <button id="hide" title="ซ่อน UI สำหรับ OBS (H)">🙈 Meeting mode</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
